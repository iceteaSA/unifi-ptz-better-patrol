name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this workflow, so a release is cut only from a
  # commit that passed these checks.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pin shellcheck
        run: |
          # Pinned so CI and developer machines agree. The apt-get package is
          # older and its warning set differs, which fails the gate on code
          # that a newer local version passes.
          mkdir -p "$RUNNER_TEMP/shellcheck/bin"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/shellcheck" --strip-components=1 shellcheck-v0.11.0/shellcheck
          mv "$RUNNER_TEMP/shellcheck/shellcheck" "$RUNNER_TEMP/shellcheck/bin/shellcheck"
          chmod +x "$RUNNER_TEMP/shellcheck/bin/shellcheck"
          echo "$RUNNER_TEMP/shellcheck/bin" >> "$GITHUB_PATH"

      - name: Pin jq to the device version
        run: |
          # UniFi Protect devices run jq 1.6; do not silently test against the runner's newer jq.
          mkdir -p "$RUNNER_TEMP/jq-1.6/bin"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/jq-1.6/bin/jq" \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          chmod +x "$RUNNER_TEMP/jq-1.6/bin/jq"
          echo "$RUNNER_TEMP/jq-1.6/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          bash --version | head -n 1
          jq --version

      - name: Run shellcheck
        # Check every tracked shell script. A hardcoded file list lets a new
        # script merge without a check.
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -s bash

      - name: Install bats
        run: npm install --prefix tests/.bats bats@1.13.0 --no-audit --no-fund

      - name: Run bats tests
        run: tests/.bats/node_modules/.bin/bats tests/
