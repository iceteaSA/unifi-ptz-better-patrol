name: Release Please

on:
  push:
    branches: [main]

# Each job declares the permissions it needs. The checks job needs only read
# access.
permissions:
  contents: read

jobs:
  checks:
    # Run the CI checks on this exact commit. release-please does not run
    # unless they pass, so a release is never cut from a red commit.
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run CI on the release PR
        # workflow_dispatch is the event that GITHUB_TOKEN can start. The
        # resulting `checks` run attaches to the release branch head, which
        # gives the release PR the result that the ruleset on main requires.
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main

  assets:
    # A tag created with GITHUB_TOKEN does not start other workflows, so the
    # release assets are built here, in the same run that created the release.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build release assets
        run: bash .github/scripts/release-assets.sh "${{ needs.release-please.outputs.version }}" dist

      - name: Verify checksums
        # The file lines are checked against the tag checkout, and the tarball
        # line against dist/.
        run: |
          grep -v '\.tar\.gz$' dist/SHA256SUMS | sha256sum --check --strict
          (cd dist && grep '\.tar\.gz$' SHA256SUMS | sha256sum --check --strict)
          tar -tzf dist/*.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
